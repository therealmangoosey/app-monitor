name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -1 | sed 's/versionName = "//;s/"//')
          CODE=$(grep -o 'versionCode = [0-9]*' app/build.gradle.kts | head -1 | awk '{print $3}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: gradle :app:assembleRelease

      - name: Check release signing configuration
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        if: steps.signing.outputs.configured == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

      - name: Align APK
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -1)
          "$ZIPALIGN" -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk

      - name: Sign APK
        if: steps.signing.outputs.configured == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" sign \
            --ks release-keystore.jks \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out "app-monitor-v${{ steps.version.outputs.version }}.apk" \
            app-release-aligned.apk
          "$APKSIGNER" verify --verbose "app-monitor-v${{ steps.version.outputs.version }}.apk"

      - name: Prepare unsigned APK
        if: steps.signing.outputs.configured != 'true'
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk "app-monitor-v${{ steps.version.outputs.version }}-unsigned.apk"

      - name: Upload unsigned build artifact
        if: steps.signing.outputs.configured != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-monitor-v${{ steps.version.outputs.version }}-unsigned
          path: app-monitor-v${{ steps.version.outputs.version }}-unsigned.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: steps.signing.outputs.configured == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: App Monitor v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: app-monitor-v${{ steps.version.outputs.version }}.apk

      - name: Explain unsigned fallback
        if: steps.signing.outputs.configured != 'true'
        run: |
          echo "Release APK was built successfully but was not published because release signing secrets are not configured."
          echo "Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD to enable signed GitHub Releases."

      - name: Remove signing material
        if: always()
        run: rm -f release-keystore.jks app-release-aligned.apk
