name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Decode stable release keystore
        shell: bash
        run: base64 --decode .github/app-monitor-release.jks.b64 > release-keystore.jks

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -1 | sed 's/versionName = "//;s/"//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: gradle :app:assembleRelease

      - name: Align APK
        shell: bash
        run: |
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -1)
          "$ZIPALIGN" -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk

      - name: Sign APK
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" sign \
            --ks release-keystore.jks \
            --ks-pass pass:appmonitor-release \
            --ks-key-alias appmonitor \
            --key-pass pass:appmonitor-release \
            --out "app-monitor-v${{ steps.version.outputs.version }}.apk" \
            app-release-aligned.apk
          "$APKSIGNER" verify --verbose "app-monitor-v${{ steps.version.outputs.version }}.apk"

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f release-keystore.jks app-release-aligned.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: App Monitor v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: app-monitor-v${{ steps.version.outputs.version }}.apk
