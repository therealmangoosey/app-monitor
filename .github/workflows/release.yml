name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -1 | sed 's/versionName = "//;s/"//')
          VERSION_CODE=$(grep -o 'versionCode = [0-9]*' app/build.gradle.kts | head -1 | sed 's/versionCode = //')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: gradle :app:assembleRelease

      - name: Prepare release APK
        id: apk
        shell: bash
        run: |
          mkdir -p release
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [[ -n "$KEYSTORE_B64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "$KEYSTORE_B64" | base64 --decode > release-keystore.jks
            ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -1)
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
            "$ZIPALIGN" -p 4 "$UNSIGNED" release/aligned.apk
            "$APKSIGNER" sign \
              --ks release-keystore.jks \
              --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASSWORD \
              --out "release/app-monitor-v${{ steps.version.outputs.version }}.apk" \
              release/aligned.apk
            "$APKSIGNER" verify "release/app-monitor-v${{ steps.version.outputs.version }}.apk"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            cp "$UNSIGNED" "release/app-monitor-v${{ steps.version.outputs.version }}-unsigned.apk"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: App Monitor v${{ steps.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/app-monitor-v${{ steps.version.outputs.version }}*.apk
          body: |
            App Monitor v${{ steps.version.outputs.version }}

            Version code: ${{ steps.version.outputs.version_code }}
            Signed APK: ${{ steps.apk.outputs.signed }}

            This release was produced by the main branch build workflow.
            When Android signing secrets are configured, the APK is signed for normal in-place updates. Otherwise the release contains an unsigned build for testing and must be signed/installed through a development workflow.

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f release-keystore.jks release/aligned.apk
