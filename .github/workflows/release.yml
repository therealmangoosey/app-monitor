name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Check release signing secrets
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS repository secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD repository secret"; exit 1; }

      - name: Decode release keystore
        shell: bash
        run: echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

      - name: Build release APK
        run: gradle :app:assembleRelease

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -1 | sed 's/versionName = "//;s/"//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Align APK
        shell: bash
        run: |
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -1)
          "$ZIPALIGN" -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk

      - name: Sign APK
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" sign \
            --ks release-keystore.jks \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out "app-monitor-v${{ steps.version.outputs.version }}.apk" \
            app-release-aligned.apk
          "$APKSIGNER" verify --verbose "app-monitor-v${{ steps.version.outputs.version }}.apk"

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f release-keystore.jks app-release-aligned.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: App Monitor v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: app-monitor-v${{ steps.version.outputs.version }}.apk
